name: Drift Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  migration-drift:
    name: Supabase migration drift
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Verify secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set."
            echo "See docs/dev-onboarding.md for setup instructions."
            exit 1
          fi
          echo "Secrets present."

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: List migrations
        run: supabase migration list --linked | tee migrations.txt

      - name: Detect drift
        id: drift
        run: |
          # supabase migration list prints a table with columns Local | Remote | Name (or similar).
          # Drift = a row where Local is empty but Remote is populated (remote-only migration).
          # We skip header lines and separator lines, then inspect data rows.
          drift_rows=$(awk -F'|' '
            NR > 2 && /\|/ {
              local=$2; remote=$3;
              gsub(/^[ \t]+|[ \t]+$/, "", local);
              gsub(/^[ \t]+|[ \t]+$/, "", remote);
              if (local == "" && remote != "") { print }
            }
          ' migrations.txt || true)

          if [ -n "$drift_rows" ]; then
            echo "Drift detected."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "No drift detected."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open drift issue
        if: steps.drift.outputs.drift == 'true'
        run: |
          gh issue create \
            --title "Migration drift detected $(date +%Y-%m-%d)" \
            --body-file migrations.txt \
            --label drift

      - name: No-drift summary
        if: steps.drift.outputs.drift == 'false'
        run: echo "No drift detected"
