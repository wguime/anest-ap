<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- A11y/WCAG 2.1: maximum-scale=5 permite zoom até 500% (atende SC 1.4.4
         Resize Text). PDFViewer usa pinch handler interno; viewport não bloqueia. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>ANEST — Gestão de Qualidade Anestesiológica</title>
    <meta name="description" content="ANEST — Gestão de qualidade para serviços de anestesiologia. 76+ calculadoras clínicas, gestão documental, LGPD/Qmentum compliance, educação continuada." />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://anest-ap.web.app/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Esquema de cor: o tema é por classe (.dark), não por prefers-color-scheme.
         "only light" é o opt-out do escuro forçado (Chrome Android Auto Dark,
         Samsung Internet Force Dark). useTheme.jsx troca para "dark" quando o
         tema escuro entra. Vem antes do theme-color (exigência do Chrome Android). -->
    <meta name="color-scheme" content="only light" />

    <!-- PWA Meta Tags. theme-color = FUNDO da página do tema ativo (aqui o valor da
         primeira pintura, tema claro); useTheme.jsx mantém sincronizado e a LoginPage
         pinta #006837 enquanto está montada. Antes era #004225 fixo e o Android
         mostrava uma moldura verde-escura que o iPhone (black-translucent) nunca teve. -->
    <meta name="theme-color" content="#F0FFF4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ANEST" />
    <meta name="application-name" content="ANEST" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#004225" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="ANEST — Gestão de Qualidade Anestesiológica" />
    <meta property="og:description" content="Plataforma de gestão de qualidade para serviços de anestesiologia: 76+ calculadoras clínicas, gestão documental, LGPD/Qmentum compliance e educação continuada." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anest-ap.web.app/" />
    <meta property="og:image" content="https://anest-ap.web.app/Anest2.png" />
    <meta property="og:image:alt" content="Logo ANEST" />
    <meta property="og:site_name" content="ANEST" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ANEST — Gestão de Qualidade Anestesiológica" />
    <meta name="twitter:description" content="Plataforma de gestão de qualidade para serviços de anestesiologia: calculadoras clínicas, gestão documental e educação continuada." />
    <meta name="twitter:image" content="https://anest-ap.web.app/Anest2.png" />

    <!-- Google Fonts - Inter (display=swap garante font-display: swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Sprint 20 LH revisit: preload LCP image (login hero) — reduz LCP ~300-500ms -->
    <link rel="preload" as="image" href="/Anest2.webp" type="image/webp" fetchpriority="high" />

    <!-- Sprint 20 LH revisit: dns-prefetch para Firebase auth iframe (carregado pós-login) -->
    <link rel="dns-prefetch" href="https://apis.google.com" />
    <link rel="dns-prefetch" href="https://anest-ap.firebaseapp.com" />

    <!-- Boot da Home: DNS+TLS antecipado dos 3 backends do caminho crítico
         (token Firebase Auth → perfil Firestore → dados Supabase). Sem isso,
         cada handshake só começa quando o JS já parseou e dispara o 1º request. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://vjzrahruvjffyyqyhjny.supabase.co" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
